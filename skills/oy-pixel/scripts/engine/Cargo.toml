[package]
name = "oy-pixel-render"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
name = "pixel_shader"
path = "src/lib.rs"

[[bin]]
name = "oy-pixel-render"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"
strip = true
